name: CI

# Builds, signs, and packages the DEVONthink extension on every PR and push to main.
# Based on the Tuna Extension Template CI:
#   https://github.com/tunaformac/TunaExtensionTemplate/blob/main/.github/workflows/ci.yml

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            package: true
          - arch: x86_64
            runner: macos-26-intel
            package: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Install build tools
        run: brew install ripgrep

      - name: Configure ad-hoc signing
        run: |
          printf '%s\n' \
            'CODE_SIGN_STYLE = Manual' \
            'CODE_SIGN_IDENTITY = -' \
            'DEVELOPMENT_TEAM =' \
            > "$RUNNER_TEMP/ci-signing.xcconfig"
          printf 'XCODE_XCCONFIG_FILE=%s\n' "$RUNNER_TEMP/ci-signing.xcconfig" \
            >> "$GITHUB_ENV"

      - name: Resolve the pinned public TunaKit package
        run: |
          xcodebuild -resolvePackageDependencies \
            -project DevonthinkExtension.xcodeproj \
            -scheme DevonthinkExtension \
            -derivedDataPath build/dd \
            -onlyUsePackageVersionsFromResolvedFile \
            -disablePackageRepositoryCache

      - name: Build the extension
        run: |
          product="$(./scripts/tuna-extension build --release)"
          codesign --verify --strict "$product"

      - name: Package the extension
        if: matrix.package
        run: |
          declaration_reader="$RUNNER_TEMP/tuna-declaration"
          printf '%s\n' \
            '#!/usr/bin/env python3' \
            'import json' \
            'print(json.dumps({"identifier": "com.tunaextensions.devonthink", "name": "DEVONthink", "author": "Kevin Dreßler", "description": "Search all DEVONthink 4 documents and open them in DEVONthink or with the default app.", "icon_name": "doc.text.magnifyingglass", "type": "extension", "compatibility": {"min_tuna": "0.80", "min_tunakit": "1.14.0"}}))' \
            > "$declaration_reader"
          chmod +x "$declaration_reader"

          TUNA_BINARY="$declaration_reader" \
            ./scripts/tuna-extension package > build/package-item.json

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from zipfile import ZipFile

          item = json.loads(Path("build/package-item.json").read_text())
          package = Path("dist/store") / f"{item['id']}-{item['version']}.tunaextension"

          assert package.is_file()
          assert item["id"] == "com.tunaextensions.devonthink"
          assert item["compatibility"]["min_tuna"] == "0.80"
          assert item["compatibility"]["min_tunakit"] == "1.14.0"
          assert item["compatibility"]["min_macos"] == "15.0"
          assert item["download"]["checksum_sha256"] == hashlib.sha256(
              package.read_bytes()
          ).hexdigest()

          with ZipFile(package) as archive:
              manifest = json.loads(archive.read("tunaextension.json"))
              assert manifest["id"] == item["id"]
              assert manifest["version"] == item["version"]
              assert manifest["compatibility"]["min_tuna"] == "0.80"
              assert manifest["compatibility"]["min_tunakit"] == "1.14.0"
              assert "payload.sha256" in archive.namelist()
              assert any(
                  name.startswith("Payload/DevonthinkExtension.framework/")
                  for name in archive.namelist()
              )
          PY
